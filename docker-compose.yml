version: '3.8'

services:
  db:
    image: postgres:15
    container_name: atm_postgres
    environment:
      POSTGRES_DB: atmdb
      POSTGRES_USER: atmuser
      POSTGRES_PASSWORD: atmpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atm_network

volumes:
  postgres_data:

networks:
  atm_network:
